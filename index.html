<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Maxwell Edegbe">

    <title>Game</title>
  </head>
  <body>
    <!-- This script handles all the prompts to the browser. Calculating the logic with conditionals whilst
    creating the values to be passed as messages. -->
    <script>
        let name = prompt('Welcome to Bear Hunter Ninja! Please enter your name to get started:');
        alert(`Hi ${name}, Let\'s Play!!`);
        let result = prompt('Who are you: Bear, Ninja, or Hunter?');
        // Hardcoded computer choice
        let compChoice = "Bear";


        let combination = 0;



        // if statements designed cover 9 cases each returning a number as an output 
        if(result == "Bear" && compChoice == "Bear"){
          combination = 1;
        }
        if(result == "Ninja" && compChoice == "Ninja"){
          combination = 2;
        }
        if(result == "Hunter" && compChoice == "Hunter"){
          combination = 3;
        }
        if(result == "Bear" && compChoice == "Ninja"){
          combination = 4;
        }
        if(result == "Ninja" && compChoice == "Hunter"){
          combination = 5;
        }
        if(result == "Hunter" && compChoice == "Bear"){
          combination = 6;
        }
        if(result == "Hunter" && compChoice == "Ninja"){
          combination = 7;
        }
        if(result == "Bear" && compChoice == "Hunter"){
          combination = 8;
        }
        if(result == "Ninja" && compChoice == "Bear"){
          combination = 9;
        }
        // Success is initialized as an empty string which would possibly be filled 
        // with an outcome message
        let success = "";
        // Switch designed to match the outcome message based on success.
          switch(combination){
            case 1 :
              success = "Tie";
              break;
            case 2:
              success = "Tie";
              break;
            case 3:
              success = "Tie";
              break;
            case 4:
              success = "You won!!";
              break;
            case 5:
              success = "You won!!";
              break;
            case 6:
              success = "You won!!";
              break;
            case 7:
              success = "Computer won";
              break;
            case 8:
              success = "Computer won";
              break;
            case 9:
              success = "Computer won";
              break;  
            default:
              success = "invalid or lowercase";  
          }
    </script>

    <!-- p tag element with ids attached -->
    <p id="output1"></p>
    <p id="output2"></p>
    <p id="output3"></p>
         <!-- script designed to print the outcome message concatenated with the choices of 
          both the user and computer while also sending the same message both on the console
          and on the html page -->
        <script>
          let message1 = name +`, You picked ${result}!`;
          let message2 = "The computer picked " + `${compChoice}` + "!";
          let message3 = success;
          document.getElementById("output1").innerText = message1;
          document.getElementById("output2").innerText = message2;
          document.getElementById("output3").innerText = message3;
          console.log(message1);
          console.log(message2);
          console.log(message3);

        </script>
    
  </body>
</html>
